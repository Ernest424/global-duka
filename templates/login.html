<!DOCTYPE html>
<html>
<head>
<style>
body { font-family: Arial; text-align: center; padding: 30px; background: #f0f8ff; }
h2 { font-size: 40px; color: #1e90ff; }
input { font-size: 20px; padding: 15px; width: 80%; max-width: 400px; margin: 8px; border-radius: 8px; border: 2px solid #ccc; }
button { font-size: 24px; padding: 15px 40px; background: #28a745; color: white; border: none; border-radius: 10px; margin-top: 15px; cursor: pointer; }
a { font-size: 20px; color: #1e90ff; }
</style>
</head>
<body>
<h2>🔐 Login to Your Duka</h2>
<form method="POST">
<input name="username" placeholder="Username" required><br>
<input name="password" type="password" placeholder="Password" required><br>
<button type="submit">Login</button>
</form>
<br><br>
<a href="/register">No account? Register here</a>
</body>
</html>
